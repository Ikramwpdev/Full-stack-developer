<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Northern Pakistan</title>
</head>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* HTML aur Body ko poori screen par stretch karne ke liye */
        html, body {
            width: 100%;
            height: 100%;
        }

        section {
            width: 100%;
            /* 100% ki bajaye 100vh use kiya taake screen ki poori height cover ho */
            height: 100vh; 
            background-image: url(https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        section h1 {
            color: white;
            font-size: 6rem;
            padding-top: 8rem;
            padding-left: 5rem;
            font-family: sans-serif;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5); /* Text ko image ke upar saaf dikhane ke liye shadow */
        }
        button {
            padding: 0.7rem 1.5rem; /* Button ko thoda behtar size diya */
            background-color: rgb(37, 128, 255);
            color: white;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            margin-left: 5rem;
            margin-top: 2rem;
            cursor: pointer; /* Button par hover karne se hath ka icon banega */
            transition: 0.3s;
        }
        button:hover {
            background-color: rgb(15, 100, 220); /* Hover effect */
        }
</style>
<body>
    <section>
        <h1>Explore<br> Northern Pakistan</h1>
        <button>Learn More</button>
    </section>
</body>
</html>
