<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        div {
            /* px em rem vh vw  */
            width: 100vw;
            height: 100vh;
            background-color: lightblue;
        }
        div div {
            width: 1rem;
            height: 7rem;
            background-color: lightcoral;
        }
     
    </style>
</head>
<body>
    <!-- inline css -->
   <div>

    <div></div>

   </div>
</body>
</html>
